<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Langfuse Hosted Observability Demo - OCI Wiring and UI Response Path</title>
  <desc id="desc">Architecture diagram showing browser, local portal, IDCS authentication, OCI Generative AI Hosted Application, Langfuse runtime, and private OCI dependencies.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 4 L 0 8 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 4 L 0 8 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 4 L 0 8 z" fill="#b45309"/>
    </marker>
    <style>
      .page { fill: #ffffff; }
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .lane-title { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 14px Arial, sans-serif; fill: #111827; }
      .box-text { font: 12px Arial, sans-serif; fill: #334155; }
      .note-text { font: 12px Arial, sans-serif; fill: #475569; }
      .edge-label { font: 12px Arial, sans-serif; font-weight: 700; fill: #334155; }
      .lane-browser { fill: #eef6ff; stroke: #6c8ebf; }
      .lane-idcs { fill: #fff4e6; stroke: #d79b00; }
      .lane-hosted { fill: #f3f0ff; stroke: #9673a6; }
      .lane-private { fill: #eef9f0; stroke: #82b366; }
      .box-browser { fill: #dae8fc; stroke: #6c8ebf; }
      .box-green { fill: #d5e8d4; stroke: #82b366; }
      .box-purple { fill: #e1d5e7; stroke: #9673a6; }
      .box-orange { fill: #ffe6cc; stroke: #d79b00; }
      .box-yellow { fill: #fff2cc; stroke: #d6b656; }
      .box-gray { fill: #f8fafc; stroke: #94a3b8; }
      .box-outline { stroke-width: 2; rx: 8; ry: 8; }
      .lane { stroke-width: 2; rx: 4; ry: 4; }
      .edge-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .edge-green { stroke: #15803d; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .edge-orange { stroke: #b45309; stroke-width: 3; fill: none; marker-end: url(#arrow-orange); }
      .edge-gray { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect class="page" width="1600" height="1000"/>
  <text class="title" x="800" y="46" text-anchor="middle">Langfuse Hosted Observability Demo - OCI Wiring and UI Response Path</text>

  <rect class="lane lane-browser" x="40" y="90" width="340" height="720"/>
  <rect class="lane lane-idcs" x="420" y="90" width="300" height="720"/>
  <rect class="lane lane-hosted" x="760" y="90" width="380" height="720"/>
  <rect class="lane lane-private" x="1180" y="90" width="360" height="720"/>

  <text class="lane-title" x="210" y="116" text-anchor="middle">Browser and Local Demo Portal</text>
  <text class="lane-title" x="570" y="116" text-anchor="middle">OCI Identity Domain / IDCS</text>
  <text class="lane-title" x="950" y="116" text-anchor="middle">OCI Generative AI Hosted Application</text>
  <text class="lane-title" x="1360" y="116" text-anchor="middle">Private Langfuse Runtime Dependencies</text>

  <rect class="box-outline box-browser" x="90" y="150" width="230" height="70"/>
  <text class="box-title" x="205" y="178" text-anchor="middle">User browser</text>
  <text class="box-text" x="205" y="200" text-anchor="middle">Launches Langfuse from portal</text>

  <rect class="box-outline box-browser" x="90" y="260" width="230" height="70"/>
  <text class="box-title" x="205" y="288" text-anchor="middle">Enterprise AI Demo Portal</text>
  <text class="box-text" x="205" y="310" text-anchor="middle">http://localhost:5173</text>

  <rect class="box-outline box-green" x="80" y="370" width="250" height="112"/>
  <text class="box-title" x="205" y="397" text-anchor="middle">Local Langfuse launch proxy</text>
  <text class="box-text" x="205" y="419" text-anchor="middle">server.mjs</text>
  <text class="box-text" x="205" y="441" text-anchor="middle">Routes /auth, /api/auth, /_next,</text>
  <text class="box-text" x="205" y="459" text-anchor="middle">/api/trpc, /project, /organization</text>

  <rect class="box-outline box-purple" x="70" y="545" width="270" height="132"/>
  <text class="box-title" x="205" y="573" text-anchor="middle">UI response handling</text>
  <text class="box-text" x="205" y="598" text-anchor="middle">Preserves native /_next paths</text>
  <text class="box-text" x="205" y="620" text-anchor="middle">Proxies Langfuse API calls</text>
  <text class="box-text" x="205" y="642" text-anchor="middle">Rewrites stale 0.0.0.0:3000</text>
  <text class="box-text" x="205" y="660" text-anchor="middle">redirects to local origin</text>

  <rect class="box-outline box-orange" x="465" y="150" width="210" height="100"/>
  <text class="box-title" x="570" y="176" text-anchor="middle">Terraform-managed IDCS App</text>
  <text class="box-text" x="570" y="198" text-anchor="middle">Confidential client</text>
  <text class="box-text" x="570" y="218" text-anchor="middle">Grant: client_credentials</text>
  <text class="box-text" x="570" y="238" text-anchor="middle">Audience + scope configured</text>

  <rect class="box-outline box-orange" x="465" y="310" width="210" height="90"/>
  <text class="box-title" x="570" y="338" text-anchor="middle">IDCS token endpoint</text>
  <text class="box-text" x="570" y="360" text-anchor="middle">/oauth2/v1/token</text>
  <text class="box-text" x="570" y="380" text-anchor="middle">Returns bearer token</text>

  <rect class="box-outline box-yellow" x="465" y="470" width="210" height="90"/>
  <text class="box-title" x="570" y="498" text-anchor="middle">Inbound Auth Policy</text>
  <text class="box-text" x="570" y="520" text-anchor="middle">Hosted app validates token</text>
  <text class="box-text" x="570" y="540" text-anchor="middle">before forwarding requests</text>

  <rect class="box-outline box-purple" x="815" y="150" width="270" height="92"/>
  <text class="box-title" x="950" y="178" text-anchor="middle">Hosted Application Invoke URL</text>
  <text class="box-text" x="950" y="200" text-anchor="middle">application.generativeai.../actions/invoke</text>
  <text class="box-text" x="950" y="220" text-anchor="middle">Used as direct hosted launch target</text>

  <rect class="box-outline box-purple" x="815" y="300" width="270" height="98"/>
  <text class="box-title" x="950" y="328" text-anchor="middle">OCI Hosted Deployment</text>
  <text class="box-text" x="950" y="350" text-anchor="middle">Public endpoint, private runtime network</text>
  <text class="box-text" x="950" y="370" text-anchor="middle">Runs the Langfuse web image</text>

  <rect class="box-outline box-purple" x="815" y="455" width="270" height="116"/>
  <text class="box-title" x="950" y="483" text-anchor="middle">Langfuse container</text>
  <text class="box-text" x="950" y="505" text-anchor="middle">docker.io/langfuse/langfuse:3</text>
  <text class="box-text" x="950" y="525" text-anchor="middle">Port 3000 in container</text>
  <text class="box-text" x="950" y="545" text-anchor="middle">Secrets injected as runtime env vars</text>

  <rect class="box-outline box-yellow" x="815" y="640" width="270" height="92"/>
  <text class="box-title" x="950" y="668" text-anchor="middle">Private OCIR image</text>
  <text class="box-text" x="950" y="690" text-anchor="middle">Terraform build and push</text>
  <text class="box-text" x="950" y="710" text-anchor="middle">Hosted deployment pulls image</text>

  <rect class="box-outline box-green" x="1235" y="150" width="250" height="80"/>
  <text class="box-title" x="1360" y="178" text-anchor="middle">VCN + private subnet</text>
  <text class="box-text" x="1360" y="200" text-anchor="middle">NAT, Service Gateway, NSGs</text>

  <rect class="box-outline box-green" x="1235" y="270" width="250" height="82"/>
  <text class="box-title" x="1360" y="298" text-anchor="middle">OCI PostgreSQL</text>
  <text class="box-text" x="1360" y="320" text-anchor="middle">Langfuse relational state</text>
  <text class="box-text" x="1360" y="338" text-anchor="middle">DATABASE_URL</text>

  <rect class="box-outline box-green" x="1235" y="390" width="250" height="82"/>
  <text class="box-title" x="1360" y="418" text-anchor="middle">ClickHouse container instance</text>
  <text class="box-text" x="1360" y="440" text-anchor="middle">Trace and event analytics</text>
  <text class="box-text" x="1360" y="458" text-anchor="middle">CLICKHOUSE_URL</text>

  <rect class="box-outline box-green" x="1235" y="510" width="250" height="82"/>
  <text class="box-title" x="1360" y="538" text-anchor="middle">Redis container instance</text>
  <text class="box-text" x="1360" y="560" text-anchor="middle">Queues, cache, background jobs</text>
  <text class="box-text" x="1360" y="578" text-anchor="middle">REDIS_CONNECTION_STRING</text>

  <rect class="box-outline box-green" x="1235" y="630" width="250" height="82"/>
  <text class="box-title" x="1360" y="658" text-anchor="middle">OCI Object Storage</text>
  <text class="box-text" x="1360" y="680" text-anchor="middle">Event and media upload buckets</text>
  <text class="box-text" x="1360" y="698" text-anchor="middle">OCI native object storage auth</text>

  <rect class="box-outline box-gray" x="105" y="855" width="1390" height="92"/>
  <text class="box-title" x="130" y="884">Launch flow</text>
  <text class="note-text" x="130" y="908">1. Portal opens the Langfuse launch route. 2. Local proxy gets an IDCS client-credentials token. 3. OCI Hosted Application validates the token and invokes the Langfuse deployment.</text>
  <text class="note-text" x="130" y="930">4. Langfuse returns HTML, assets, and API responses through the proxy while private dependencies stay inside OCI networking.</text>

  <path class="edge-blue" d="M205 220 L205 260"/>
  <path class="edge-blue" d="M205 330 L205 370"/>
  <path class="edge-orange" d="M330 426 C380 426 398 355 465 355"/>
  <text class="edge-label" x="348" y="382">request access token</text>
  <path class="edge-orange" d="M570 310 L570 250"/>
  <path class="edge-green" d="M675 355 C735 355 735 196 815 196"/>
  <text class="edge-label" x="710" y="238">Bearer token</text>
  <path class="edge-green" d="M950 242 L950 300"/>
  <path class="edge-green" d="M950 398 L950 455"/>
  <path class="edge-gray" d="M950 571 L950 640"/>
  <path class="edge-green" d="M1085 190 L1235 190"/>
  <text class="edge-label" x="1110" y="178">private subnet attachment</text>
  <path class="edge-green" d="M1085 500 C1140 500 1150 311 1235 311"/>
  <path class="edge-green" d="M1085 520 C1148 520 1150 431 1235 431"/>
  <path class="edge-green" d="M1085 540 C1148 540 1150 551 1235 551"/>
  <path class="edge-green" d="M1085 560 C1150 560 1150 671 1235 671"/>
  <path class="edge-blue" d="M815 196 C650 196 455 610 340 610"/>
  <text class="edge-label" x="530" y="650">HTML, assets, API responses</text>
</svg>
