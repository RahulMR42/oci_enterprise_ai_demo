version: 0.1
component: build
timeoutInSeconds: 3600
shell: bash
failImmediatelyOnError: true

env:
  exportedVariables:
    - PORTAL_VECTOR_STORE_ID
    - PORTAL_CONVERSATION_ID
    - PORTAL_CODE_INTERPRETER_CONTAINER_ID
    - PORTAL_CODE_INTERPRETER_CONTAINER_STATUS
    - PORTAL_FILE_SEARCH_SEED_DOCUMENT_COUNT
    - PORTAL_FILE_SEARCH_SEED_DOCUMENT_COMPLETED_COUNT

steps:
  - type: Command
    name: provision-generated-runtime
    timeoutInSeconds: 3600
    command: |
      set -euo pipefail

      unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY no_proxy NO_PROXY PIP_PROXY PIP_INDEX_URL PIP_EXTRA_INDEX_URL
      python3 -m pip install --user --upgrade --proxy "" --index-url https://pypi.org/simple oci-cli openai oci-openai
      export PATH="$HOME/.local/bin:$PATH"
      python3 infra/devops-hosted-image-build/scripts/provision_generated_runtime.py
      if [ -f /tmp/provision-generated-runtime.env ]; then
        . /tmp/provision-generated-runtime.env
      fi
