version: 0.1
component: build
timeoutInSeconds: 3600
shell: bash
failImmediatelyOnError: true

steps:
  - type: Command
    name: provision-generated-runtime
    timeoutInSeconds: 3600
    command: |
      set -euo pipefail

      unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY no_proxy NO_PROXY PIP_PROXY PIP_INDEX_URL PIP_EXTRA_INDEX_URL
      python3 -m pip install --user --upgrade --proxy "" --index-url https://pypi.org/simple oci-cli openai oci-openai
      export PATH="$HOME/.local/bin:$PATH"
      python3 infra/devops-hosted-image-build/scripts/provision_generated_runtime.py
