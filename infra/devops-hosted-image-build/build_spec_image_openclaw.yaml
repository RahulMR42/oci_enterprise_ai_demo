version: 0.1
component: build
timeoutInSeconds: 7200
shell: bash
failImmediatelyOnError: true

env:
  variables:
    OPENCLAW_CONTEXT: "apps/hosted-openclaw"

steps:
  - type: Command
    name: build-openclaw-image
    timeoutInSeconds: 7200
    command: |
      set -euo pipefail

      podman build --platform linux/amd64 -t openclaw-image "$OPENCLAW_CONTEXT"

outputArtifacts:
  - name: openclaw-image
    type: DOCKER_IMAGE
    location: openclaw-image
