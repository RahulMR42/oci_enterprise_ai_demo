version: 0.1
component: build
timeoutInSeconds: 7200
shell: bash
failImmediatelyOnError: true

env:
  variables:
    HOSTED_AGENT_CONTEXT: "apps/hosted-agent"
    LANGGRAPH_CONTEXT: "apps/hosted-langgraph-agent"
    N8N_CONTEXT: "apps/hosted-n8n"
    LANGFUSE_CONTEXT: "apps/hosted-langfuse"
    OPENCLAW_CONTEXT: "apps/hosted-openclaw"
    LLAMAINDEX_CONTEXT: "apps/hosted-llamaindex-control-tower"
  exportedVariables:
    - HOSTED_AGENT_IMAGE_URI
    - LANGGRAPH_IMAGE_URI
    - N8N_IMAGE_URI
    - LANGFUSE_IMAGE_URI
    - OPENCLAW_IMAGE_URI
    - LLAMAINDEX_IMAGE_URI

steps:
  - type: Command
    name: build-and-push-hosted-images
    timeoutInSeconds: 7200
    command: |
      set -euo pipefail

      : "${RESOURCE_SUFFIX:?RESOURCE_SUFFIX is required}"
      : "${OCI_REGION:?OCI_REGION is required}"
      : "${OCIR_REGION_KEY:?OCIR_REGION_KEY is required}"
      : "${OCIR_NAMESPACE:?OCIR_NAMESPACE is required}"
      : "${IMAGE_TAG:?IMAGE_TAG is required}"
      : "${OCIR_USERNAME:?OCIR_USERNAME is required}"
      : "${OCIR_AUTH_TOKEN:?OCIR_AUTH_TOKEN is required}"

      registry="${OCIR_REGION_KEY}.ocir.io"
      printf '%s' "$OCIR_AUTH_TOKEN" | podman login "$registry" --username "$OCIR_USERNAME" --password-stdin

      build_push() {
        local context="$1"
        local repository="$2"
        local image_uri="${registry}/${OCIR_NAMESPACE}/${repository}:${IMAGE_TAG}"
        podman build --platform linux/amd64 -t "$image_uri" "$context"
        podman push "$image_uri"
        printf '%s\n' "$image_uri"
      }

      HOSTED_AGENT_IMAGE_URI="$(build_push "$HOSTED_AGENT_CONTEXT" "enterprise-ai-demo/hosted-agent-${RESOURCE_SUFFIX}")"
      LANGGRAPH_IMAGE_URI="$(build_push "$LANGGRAPH_CONTEXT" "enterprise-ai-demo/hosted-langgraph-agent-${RESOURCE_SUFFIX}")"
      N8N_IMAGE_URI="$(build_push "$N8N_CONTEXT" "enterprise-ai-demo/hosted-n8n-${RESOURCE_SUFFIX}")"
      LANGFUSE_IMAGE_URI="$(build_push "$LANGFUSE_CONTEXT" "enterprise-ai-demo/hosted-langfuse-${RESOURCE_SUFFIX}")"
      OPENCLAW_IMAGE_URI="$(build_push "$OPENCLAW_CONTEXT" "enterprise-ai-demo/hosted-openclaw-${RESOURCE_SUFFIX}")"
      LLAMAINDEX_IMAGE_URI="$(build_push "$LLAMAINDEX_CONTEXT" "enterprise-ai-demo/hosted-llamaindex-control-tower-${RESOURCE_SUFFIX}")"

      {
        echo "HOSTED_AGENT_IMAGE_URI=$HOSTED_AGENT_IMAGE_URI"
        echo "LANGGRAPH_IMAGE_URI=$LANGGRAPH_IMAGE_URI"
        echo "N8N_IMAGE_URI=$N8N_IMAGE_URI"
        echo "LANGFUSE_IMAGE_URI=$LANGFUSE_IMAGE_URI"
        echo "OPENCLAW_IMAGE_URI=$OPENCLAW_IMAGE_URI"
        echo "LLAMAINDEX_IMAGE_URI=$LLAMAINDEX_IMAGE_URI"
      } | tee hosted-image-uris.env
