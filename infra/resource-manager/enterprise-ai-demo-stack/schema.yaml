schemaVersion: 1.1.0
version: "20260525"
locale: en
title: Enterprise AI Demo Portal
description: One-click Resource Manager stack for deploying the Enterprise AI Demo Portal to OCI Container Instances.

variableGroups:
  - title: Target
    variables:
      - compartment_id
      - region
      - resource_suffix
  - title: Portal Image And Runtime
    variables:
      - portal_image_uri
      - portal_port
      - portal_password
      - container_shape
      - container_ocpus
      - container_memory_gbs
  - title: Network
    variables:
      - existing_subnet_id
      - create_public_network
      - vcn_cidr
      - subnet_cidr
      - allowed_ingress_cidr
  - title: Demo Infrastructure
    variables:
      - provision_demo_infra
      - enabled_demo_modules
      - require_demo_infra

variables:
  compartment_id:
    title: Compartment OCID
    description: Compartment where Resource Manager creates the portal resources.
    type: oci:identity:compartment:id
    required: true

  region:
    title: OCI Region
    description: Region used by Terraform and the portal runtime.
    type: string
    required: true
    default: us-chicago-1

  resource_suffix:
    title: Resource Suffix
    description: Short suffix used in display names.
    type: string
    required: true
    default: rm001

  portal_image_uri:
    title: Portal Image URI
    description: Prebuilt OCIR image URI for the portal container.
    type: string
    required: true

  portal_password:
    title: Portal Password
    description: Password for the portal login user oci.
    type: password
    required: true
    sensitive: true

  portal_port:
    title: Portal Port
    description: HTTP port exposed by the portal container.
    type: number
    required: true
    default: 5173

  existing_subnet_id:
    title: Existing Subnet OCID
    description: Existing subnet for the portal container. Leave empty to create a public demo network.
    type: string
    required: false
    default: ""

  create_public_network:
    title: Create Public Network
    description: Create a public demo VCN, subnet, internet gateway, route table, and security list when no subnet is supplied.
    type: boolean
    required: true
    default: true

  vcn_cidr:
    title: VCN CIDR
    description: CIDR block for the optional public demo VCN.
    type: string
    required: true
    default: 10.71.0.0/16

  subnet_cidr:
    title: Subnet CIDR
    description: CIDR block for the optional public demo subnet.
    type: string
    required: true
    default: 10.71.1.0/24

  allowed_ingress_cidr:
    title: Allowed Ingress CIDR
    description: CIDR range allowed to reach the portal port.
    type: string
    required: true
    default: 0.0.0.0/0

  container_shape:
    title: Container Shape
    description: OCI Container Instances shape.
    type: string
    required: true
    default: CI.Standard.E4.Flex

  container_ocpus:
    title: Container OCPUs
    description: OCPUs assigned to the portal container.
    type: number
    required: true
    default: 1

  container_memory_gbs:
    title: Container Memory GB
    description: Memory assigned to the portal container.
    type: number
    required: true
    default: 6

  provision_demo_infra:
    title: Provision Demo Infrastructure
    description: Let the portal attempt selected demo infrastructure provisioning on startup.
    type: boolean
    required: true
    default: false

  enabled_demo_modules:
    title: Enabled Demo Modules
    description: Demo modules passed to the portal when provisioning is enabled.
    type: array
    items:
      type: string
    required: true
    default:
      - responses-api

  require_demo_infra:
    title: Require Demo Infrastructure
    description: Fail portal startup when selected demo infrastructure cannot be provisioned.
    type: boolean
    required: true
    default: false

outputs:
  portal_url:
    title: Portal URL
    type: link
  portal_public_ip:
    title: Portal Public IP
    type: string
  container_instance_id:
    title: Container Instance OCID
    type: string
