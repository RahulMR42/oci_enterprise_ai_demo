title: Enterprise AI Demo Resource Manager Stack
description: Deploys the Enterprise AI demo portal, shared OCI Generative AI resources, OCI DevOps image pipeline, and hosted applications.
schemaVersion: 1.1.0
version: 20260527
locale: en

variableGroups:
  - title: Required OCI Target
    variables:
      - tenancy_id
      - compartment_id
      - region
      - resource_suffix
  - title: Source Branch and DevOps Build
    variables:
      - devops_source_repo_url
      - devops_source_branch
      - devops_source_revision
      - devops_repository_branch
      - devops_source_connection_type
      - devops_create_repository
      - devops_repository_git_username
      - devops_repository_git_password
      - devops_hosted_image_build_enabled
      - devops_hosted_image_run_build
      - deploy_only_app
      - app_deploy
      - oci_ha_hosted_agent_deploy
      - oci_ha_langgraph_deploy
      - oci_ha_langfuse_deploy
      - oci_ha_openclaw_deploy
      - oci_ha_llamaindex_deploy
      - existing_hosted_deployment_exports_json
      - existing_portal_runtime_config_json
  - title: Portal Hosted Application
    variables:
      - portal_container_enabled
      - portal_container_repository_id
      - portal_container_repository_name
      - portal_container_image_tag
      - portal_auth_password_secret_id
  - title: OCI Generative AI Runtime
    variables:
      - project_display_name
      - oci_genai_project_id
      - oci_genai_api_key_secret_id
  - title: Hosted Application Auth
    variables:
      - idcs_domain_url
      - idcs_audience
      - idcs_scope
      - hosted_app_idcs_client_secret_id
      - openclaw_gateway_token
  - title: Advanced and Local-Exec Switches
    variables:
      - hosted_applications_local_exec_enabled
      - responses_api_local_exec_enabled
      - conversation_store_local_exec_enabled
      - file_search_local_exec_enabled
      - code_interpreter_local_exec_enabled
      - hosted_app_push_image
      - hosted_app_container_cli
      - hosted_app_ocir_region_key
      - portal_container_image_uri
      - langfuse_image_repository_uri
      - openclaw_image_repository_uri
      - llamaindex_image_repository_uri
      - profile

variables:
  tenancy_id:
    title: Tenancy OCID
    description: Tenancy OCID where shared IAM resources are created.
    type: ocid
    required: true
  compartment_id:
    title: Compartment OCID
    description: Compartment OCID that owns all demo resources.
    type: ocid
    required: true
  region:
    title: OCI Region
    description: Region for all regional resources.
    type: string
    default: us-chicago-1
    required: true
  resource_suffix:
    title: Resource Suffix
    description: Exactly six lowercase letters or digits. Keep this stable across reruns to update the same stack resources.
    type: string
    required: true
    pattern: "^[a-z0-9]{6}$"
  devops_source_repo_url:
    title: Source Git Repository URL
    description: HTTPS Git repository cloned by Resource Manager before seeding the OCI DevOps repository.
    type: string
    default: https://github.com/RahulMR42/oci_enterprise_ai_demo.git
  devops_source_branch:
    title: Source Git Branch
    description: Target source branch for Resource Manager. Use oci-rms for this deployment path.
    type: string
    default: oci-rms
    pattern: "^[A-Za-z0-9._/-]+$"
  devops_source_revision:
    title: Source Revision
    description: Optional Git commit SHA. Set this when branch contents change to force a new DevOps build run.
    type: string
    required: false
    pattern: "^$|^[A-Fa-f0-9]{7,40}$"
  devops_repository_branch:
    title: OCI DevOps Repository Branch
    description: Branch name inside the OCI DevOps code repository used by build stages.
    type: string
    default: main
  devops_source_connection_type:
    title: DevOps Source Connection Type
    description: Keep DEVOPS_CODE_REPOSITORY when Resource Manager seeds an OCI DevOps repository.
    type: enum
    enum:
      - DEVOPS_CODE_REPOSITORY
      - GITHUB
    default: DEVOPS_CODE_REPOSITORY
  devops_create_repository:
    title: Create OCI DevOps Repository
    type: boolean
    default: true
  devops_repository_git_username:
    title: OCI DevOps Git Username
    type: string
    required: true
  devops_repository_git_password:
    title: OCI DevOps Git Password or Auth Token
    type: password
    required: true
    sensitive: true
  devops_hosted_image_build_enabled:
    title: Enable OCI DevOps Hosted Image Build
    type: boolean
    default: true
  devops_hosted_image_run_build:
    title: Run OCI DevOps Build During Apply
    type: boolean
    default: true
  deploy_only_app:
    title: DEPLOY_ONLY_APP
    description: When true, hosted application deployment commands exit as skipped; use this for portal-only redeployments that must not touch ClickHouse, Redis, or hosted app deployments.
    type: boolean
    default: false
  app_deploy:
    title: APP_DEPLOY
    description: Set to all to build, deliver, and deploy every hosted application, portal to deploy only the Enterprise AI portal hosted application, or leave empty to use the OCI_HA_* per-application switches; enable the needed switches on the first deployment so those hosted apps are created.
    type: string
    default: all
  oci_ha_hosted_agent_deploy:
    title: OCI_HA_HOSTED_AGENT_DEPLOY
    description: When true, build, deliver, and deploy the hosted-agent hosted application through OCI DevOps. Set true on the first deployment if the hosted-agent app should be created; leave false on later selective runs unless replacing it.
    type: boolean
    default: false
  oci_ha_langgraph_deploy:
    title: OCI_HA_LANGGRAPH_DEPLOY
    description: When true, build, deliver, and deploy the LangGraph hosted application through OCI DevOps. Set true on the first deployment if the LangGraph app should be created; leave false on later selective runs unless replacing it.
    type: boolean
    default: false
  oci_ha_langfuse_deploy:
    title: OCI_HA_LANGFUSE_DEPLOY
    description: When true, build, deliver, and deploy the Langfuse hosted application through OCI DevOps. Set true on the first deployment if the Langfuse app should be created; leave false on later selective runs unless replacing it.
    type: boolean
    default: false
  oci_ha_openclaw_deploy:
    title: OCI_HA_OPENCLAW_DEPLOY
    description: When true, build, deliver, and deploy the OpenClaw hosted application through OCI DevOps. Set true on the first deployment if the OpenClaw app should be created; leave false on later selective runs unless replacing it.
    type: boolean
    default: false
  oci_ha_llamaindex_deploy:
    title: OCI_HA_LLAMAINDEX_DEPLOY
    description: When true, build, deliver, and deploy the LlamaIndex control tower hosted application through OCI DevOps. Set true on the first deployment if the LlamaIndex app should be created; leave false on later selective runs unless replacing it.
    type: boolean
    default: false
  existing_hosted_deployment_exports_json:
    title: Existing Hosted Deployment Exports
    description: Non-sensitive JSON object of hosted app deployment IDs and URLs to reuse when DEPLOY_ONLY_APP skips hosted deployment stages.
    type: text
    required: false
    default: "{}"
  existing_portal_runtime_config_json:
    title: Existing Portal Runtime Config
    description: Non-sensitive JSON copy of portal-runtime-config.json used to retain generated conversation, vector store, and code interpreter IDs across redeployments.
    type: text
    required: false
    default: "{}"
  portal_container_enabled:
    title: Deploy Portal Hosted Application
    description: Builds and deploys the portal as a no-auth OCI Generative AI hosted application.
    type: boolean
    default: true
  portal_container_repository_id:
    title: Existing Portal OCIR Repository OCID
    description: Optional. Use this to adopt an existing portal image repository instead of creating a duplicate.
    type: ocid
    required: false
  portal_container_repository_name:
    title: Portal OCIR Repository Name
    type: string
    default: enterprise-ai-demo/portal-rm
  portal_container_image_tag:
    title: Portal Image Tag
    type: string
    default: latest
  portal_auth_password_secret_id:
    title: Portal Password Secret OCID
    description: OCI Vault secret OCID containing the portal login password. The hosted application receives it as a VAULT environment variable.
    type: ocid
    required: true
    sensitive: true
  project_display_name:
    title: OCI Generative AI Project Display Name Prefix
    type: string
    default: enterprise-ai-demo-responses-api
  oci_genai_project_id:
    title: Existing OCI Generative AI Project OCID
    type: ocid
    required: false
  oci_genai_api_key_secret_id:
    title: OCI GenAI API Key Secret OCID
    description: Optional OCI Vault secret OCID containing the OCI Generative AI API key for the portal hosted application.
    type: ocid
    required: false
    sensitive: true
  idcs_domain_url:
    title: IDCS Domain URL
    description: HTTPS identity domain URL used for hosted application inbound auth.
    type: string
    required: true
  idcs_audience:
    title: IDCS Audience
    type: string
    required: true
  idcs_scope:
    title: IDCS Scope
    type: string
    required: true
  hosted_app_idcs_client_secret_id:
    title: Hosted Launch Client Secret OCID
    description: Optional OCI Vault secret OCID containing the IDCS OAuth client secret used by portal launch proxy routes.
    type: ocid
    required: false
    sensitive: true
  openclaw_gateway_token:
    title: OpenClaw Gateway Token
    type: password
    required: false
    sensitive: true
  hosted_applications_local_exec_enabled:
    title: Enable Hosted App Local-Exec
    type: boolean
    default: false
  responses_api_local_exec_enabled:
    title: Enable Responses API Local-Exec
    type: boolean
    default: false
  conversation_store_local_exec_enabled:
    title: Enable Conversation Store Local-Exec
    description: Legacy/local fallback only. Leave disabled for Resource Manager; OCI DevOps creates or reuses the OCI Conversations API object with resource principal auth.
    type: boolean
    default: false
  file_search_local_exec_enabled:
    title: Enable File Search Local-Exec
    description: Legacy/local fallback only. Leave disabled for Resource Manager; OCI DevOps creates or reuses the Vector Store and seeds bundled PDFs with resource principal auth.
    type: boolean
    default: false
  code_interpreter_local_exec_enabled:
    title: Enable Code Interpreter Local-Exec
    description: Legacy/local fallback only. Leave disabled for Resource Manager; OCI DevOps creates or reuses the Code Interpreter container with resource principal auth.
    type: boolean
    default: false
  hosted_app_push_image:
    title: Build Images From Terraform Local-Exec
    type: boolean
    default: false
  hosted_app_container_cli:
    title: Local Container CLI
    type: enum
    enum:
      - podman
      - docker
    default: podman
  hosted_app_ocir_region_key:
    title: OCIR Region Key
    type: string
    default: ord
  portal_container_image_uri:
    title: Optional Full Portal Image URI
    type: string
    required: false
  langfuse_image_repository_uri:
    title: Optional Langfuse Image Repository URI
    type: string
    required: false
  openclaw_image_repository_uri:
    title: Optional OpenClaw Image Repository URI
    type: string
    required: false
  llamaindex_image_repository_uri:
    title: Optional LlamaIndex Image Repository URI
    type: string
    required: false
  profile:
    title: Local OCI CLI Profile
    type: string
    required: false
