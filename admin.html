<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administration | OCI Enterprise AI Portal</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="admin-page" id="administration">
      <header class="admin-page-header">
        <nav aria-label="Administration">
          <div class="brand-mark">
            <span class="brand-icon" aria-hidden="true">AI</span>
            <span>OCI Enterprise AI Administration</span>
          </div>
          <div class="nav-actions">
            <a class="nav-link" href="/">Catalog</a>
            <button class="nav-link logout-button" id="admin-refresh-button" type="button">Refresh</button>
          </div>
        </nav>
      </header>

      <section class="admin-section" aria-labelledby="administration-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Administration</p>
            <h1 id="administration-title">Demo operations</h1>
          </div>
          <p class="section-note" id="admin-last-updated">Loading operational status...</p>
        </div>

        <div class="admin-metric-grid" id="admin-metric-grid">
          <div class="admin-metric"><span>Total runs</span><strong>0</strong></div>
          <div class="admin-metric"><span>Success</span><strong>0</strong></div>
          <div class="admin-metric"><span>Failed</span><strong>0</strong></div>
          <div class="admin-metric"><span>Avg duration</span><strong>0 ms</strong></div>
        </div>

        <div class="admin-layout">
          <section class="admin-demo-table" aria-label="Usage summary">
            <h2>Usage summary</h2>
            <div id="admin-demo-summary">
              <div class="admin-demo-row">
                <strong>No demo runs yet</strong>
                <span>Run a demo to populate usage metrics.</span>
              </div>
            </div>
          </section>
        </div>

        <section class="admin-run-log-panel" aria-label="Recent execution logs">
          <div class="admin-run-log-heading">
            <h2>Recent execution logs</h2>
            <label>
              <span>Status</span>
              <select id="admin-run-status-filter" aria-label="Filter execution logs by status">
                <option value="all">All</option>
                <option value="success">Success</option>
                <option value="failed">Failed</option>
                <option value="started">Started</option>
                <option value="unknown">Unknown</option>
              </select>
            </label>
          </div>
          <div id="admin-run-logs">
            <div class="admin-run-log-empty">No execution logs yet.</div>
          </div>
        </section>
      </section>
    </main>
    <script type="module" src="/src/admin.js"></script>
  </body>
</html>
