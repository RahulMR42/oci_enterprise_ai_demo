name: Publish Resource Manager Stack

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the stack zip to.
        required: true

permissions:
  contents: write

jobs:
  package-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package Resource Manager stack
        run: |
          set -euo pipefail
          cd infra/resource-manager/enterprise-ai-demo-stack
          zip -qr "$GITHUB_WORKSPACE/enterprise-ai-demo-rm-stack.zip" . \
            -x '.terraform/*' \
            -x '.terraform.lock.hcl' \
            -x '*.tfstate' \
            -x '*.tfstate.*' \
            -x '*.tfvars' \
            -x '*.auto.tfvars'
          unzip -l "$GITHUB_WORKSPACE/enterprise-ai-demo-rm-stack.zip"

      - name: Attach stack zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: enterprise-ai-demo-rm-stack.zip
          fail_on_unmatched_files: true
